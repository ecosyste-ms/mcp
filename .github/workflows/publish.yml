name: Publish to npm

# Uses npm trusted publishing (OIDC) - no NPM_TOKEN secret needed. The trusted
# publisher must be registered on the npmjs.com package settings, pointing at this
# exact repo + workflow file before this can succeed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Pinned rather than @latest so an
      # untested npm release cannot silently change publish behaviour.
      - run: npm install -g npm@12.0.2

      - run: npm ci
      - run: npm test
      - run: npm publish
